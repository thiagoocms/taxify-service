services:
  mysql:
    image: mysql:8.4
    container_name: taxify-mysql
    restart: unless-stopped
    # InnoDB cache capped (MySQL's own default is 128M, but it grows with tuning scripts); 256M
    # is plenty for the Taxify's tables and keeps memory for the backend on a 2-4 GB machine.
    command: [ "--innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL:-256M}" ]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-taxify_dev}
      MYSQL_USER: ${DB_USER:-taxify}
      MYSQL_PASSWORD: ${DB_PASSWORD:-taxify}
    ports:
      - "3310:3306"
    volumes:
      - taxify_mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: thiagoocms/taxify-service:${TAG:-latest}
    # Alternativa: buildar da fonte local em vez de puxar a imagem do Docker Hub.
#    build:
#      context: .
#      dockerfile: Dockerfile
    container_name: taxify-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # heap at 45% of the RAM; on a 2 GB machine with MySQL beside it don't go above 45
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=45 -XX:+ExitOnOutOfMemoryError}
      SERVER_PORT: 5000
      SPRING_PROFILES_ACTIVE: test
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-taxify_dev}
      DB_USER: ${DB_USER:-taxify}
      DB_PASSWORD: ${DB_PASSWORD:-taxify}
      SIEG_CLIENT_ID: ${SIEG_CLIENT_ID}
      SIEG_CLIENT_SECRET: ${SIEG_CLIENT_SECRET}
      FISCAL_XML_STORAGE_PATH: /data/fiscal-xml
      # local = volume abaixo; s3 = bucket (os XMLs que já estão no volume continuam sendo lidos dele)
      FISCAL_XML_STORAGE_TYPE: ${FISCAL_XML_STORAGE_TYPE:-local}
      # true = copia em segundo plano os XMLs do volume para o S3 na subida (pode ficar ligado até terminar)
      FISCAL_XML_STORAGE_MIGRATE_LOCAL: ${FISCAL_XML_STORAGE_MIGRATE_LOCAL:-false}
      FISCAL_XML_S3_BUCKET: ${FISCAL_XML_S3_BUCKET:-taxify-cshub}
      FISCAL_XML_S3_REGION: ${FISCAL_XML_S3_REGION:-us-east-2}
      FISCAL_XML_S3_PREFIX: ${FISCAL_XML_S3_PREFIX:-fiscal-xml}
      # Credenciais: prefira a IAM role da instância EC2. Sem role, defina no .env:
      # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (e descomente as duas linhas abaixo)
      # AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      # AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      FISCAL_XML_SYNC_ENABLED: true
      FISCAL_XML_SYNC_CRON: 0 0/5 * * * *
      FISCAL_XML_SYNC_BATCH_SIZE: 2
      FISCAL_XML_SYNC_PROVIDER: sieg
      FISCAL_XML_RECTIFICATION_ENABLED: true
      FISCAL_XML_RECTIFICATION_CRON: 0 0/30 * * * *
      FISCAL_XML_RECTIFICATION_LOOKBACK_DAYS: 50
      FISCAL_XML_PURGE_ENABLED: true
      FISCAL_XML_PURGE_CRON: 0 0 4 1 * *
      FISCAL_XML_PURGE_RETENTION_MONTHS: 3
      # Captura direto da SEFAZ (NFeDistribuicaoDFe) com o certificado A1 de cada empresa, de hora em hora.
      SEFAZ_DIST_ENABLED: ${SEFAZ_DIST_ENABLED:-true}
      SEFAZ_DIST_CRON: ${SEFAZ_DIST_CRON:-0 15 * * * *}
      # UFs com captura automática (vírgula, ex. PE,PB); vazio = todas.
      SEFAZ_DIST_UFS: ${SEFAZ_DIST_UFS:-}
      # Ciência da Operação automática (só para planos com "Manifestação do destinatário").
      SEFAZ_AUTO_CIENCIA: ${SEFAZ_AUTO_CIENCIA:-true}
      # NFS-e pelo Ambiente Nacional (só para planos com "Integração NFS-e Nacional").
      NFSE_ADN_ENABLED: ${NFSE_ADN_ENABLED:-true}
      NFSE_ADN_CRON: ${NFSE_ADN_CRON:-0 25 * * * *}
      # false = produção restrita (ambiente de testes nacional)
      NFSE_ADN_PRODUCTION: ${NFSE_ADN_PRODUCTION:-true}
      # Pendências recalculadas de hora em hora.
      PENDENCIES_ENABLED: ${PENDENCIES_ENABLED:-true}
      PENDENCIES_CRON: ${PENDENCIES_CRON:-0 40 * * * *}
      # Auditoria tipo malha, todo dia às 05:30 (planos com "Auditoria de notas fiscais").
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
      AUDIT_CRON: ${AUDIT_CRON:-0 30 5 * * *}
      # Opcional: chave que cifra os certificados A1 e as senhas (openssl rand -base64 32). Vazia = sem essa criptografia.
      CERT_ENCRYPTION_KEY: ${CERT_ENCRYPTION_KEY:-}
      ACESSORIAS_SYNC_ENABLED: true
      ACESSORIAS_SYNC_CRON: 0 0 3 * * *
      BILLING_SYNC_ENABLED: true
      BILLING_SYNC_CRON: 0 30 3 * * *
      CONTA_AZUL_CLIENT_ID: ${CONTA_AZUL_CLIENT_ID:-}
      CONTA_AZUL_CLIENT_SECRET: ${CONTA_AZUL_CLIENT_SECRET:-}
      CONTA_AZUL_REDIRECT_URI: ${CONTA_AZUL_REDIRECT_URI:-}
      CONTA_AZUL_AUTHORIZE_URL: ${CONTA_AZUL_AUTHORIZE_URL:-}
      CONTA_AZUL_TOKEN_URL: ${CONTA_AZUL_TOKEN_URL:-}
    ports:
      - "5000:5000"
    volumes:
      - taxify_fiscal_xml:/data/fiscal-xml

  frontend:
    image: thiagoocms/taxify-ui:${TAG:-latest}
    # Alternativa: buildar da fonte local em vez de puxar a imagem do Docker Hub.
#    build:
#      context: ../taxify-front
#      dockerfile: Dockerfile
    container_name: taxify-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  taxify_mysql_data:
  taxify_fiscal_xml:
