services:
  mysql:
    image: mysql:8.4
    container_name: taxify-mysql
    restart: unless-stopped
    # InnoDB cache capped (MySQL's own default is 128M, but it grows with tuning scripts); 256M
    # is plenty for the Taxify's tables and keeps memory for the backend on a 2-4 GB machine.
    # performance_schema desligado: sozinho ocupa 100-200 MB e o Taxify não usa.
    command: [ "--innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL:-256M}", "--performance-schema=${MYSQL_PERFORMANCE_SCHEMA:-OFF}" ]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-taxify_dev}
      MYSQL_USER: ${DB_USER:-taxify}
      MYSQL_PASSWORD: ${DB_PASSWORD:-taxify}
    ports:
      - "3310:3306"
    volumes:
      - taxify_mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: thiagoocms/taxify-service:${TAG:-latest}
    # Alternativa: buildar da fonte local em vez de puxar a imagem do Docker Hub.
#    build:
#      context: .
#      dockerfile: Dockerfile
    container_name: taxify-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Memória fixa para uma máquina de 2 GB com o MySQL ao lado: heap 512 MB e os pedaços fora do heap
      # limitados (metaspace, code cache, buffers diretos, pilha das threads); SerialGC e cabeçalhos compactos
      # (Java 25) gastam menos que o G1 padrão. Faltou memória (OutOfMemoryError no log)? Suba o -Xmx no .env.
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m -Xss512k -XX:+UseSerialGC -XX:+UseCompactObjectHeaders -XX:+ExitOnOutOfMemoryError}
      # Padrão do Spring é 200 threads no Tomcat e 10 conexões no banco: muito para esse uso.
      SERVER_TOMCAT_THREADS_MAX: ${SERVER_TOMCAT_THREADS_MAX:-40}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-6}
      SERVER_PORT: 5000
      SPRING_PROFILES_ACTIVE: test
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-taxify_dev}
      DB_USER: ${DB_USER:-taxify}
      DB_PASSWORD: ${DB_PASSWORD:-taxify}
      SIEG_CLIENT_ID: ${SIEG_CLIENT_ID}
      SIEG_CLIENT_SECRET: ${SIEG_CLIENT_SECRET}
      FISCAL_XML_STORAGE_PATH: /data/fiscal-xml
      # local = volume abaixo; s3 = bucket (os XMLs que já estão no volume continuam sendo lidos dele)
      FISCAL_XML_STORAGE_TYPE: ${FISCAL_XML_STORAGE_TYPE:-local}
      # true = copia em segundo plano os XMLs do volume para o S3 na subida (pode ficar ligado até terminar)
      FISCAL_XML_STORAGE_MIGRATE_LOCAL: ${FISCAL_XML_STORAGE_MIGRATE_LOCAL:-false}
      FISCAL_XML_S3_BUCKET: ${FISCAL_XML_S3_BUCKET:-taxify-cshub}
      FISCAL_XML_S3_REGION: ${FISCAL_XML_S3_REGION:-us-east-2}
      FISCAL_XML_S3_PREFIX: ${FISCAL_XML_S3_PREFIX:-fiscal-xml}
      # Credenciais: prefira a IAM role da instância EC2. Sem role, defina no .env:
      # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (e descomente as duas linhas abaixo)
      # AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      # AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      FISCAL_XML_SYNC_ENABLED: true
      FISCAL_XML_SYNC_CRON: 0 0/5 * * * *
      FISCAL_XML_SYNC_BATCH_SIZE: 2
      FISCAL_XML_SYNC_PROVIDER: sieg
      FISCAL_XML_RECTIFICATION_ENABLED: true
      FISCAL_XML_RECTIFICATION_CRON: 0 0/30 * * * *
      FISCAL_XML_RECTIFICATION_LOOKBACK_DAYS: 50
      FISCAL_XML_PURGE_ENABLED: true
      FISCAL_XML_PURGE_CRON: 0 0 4 1 * *
      FISCAL_XML_PURGE_RETENTION_MONTHS: 3
      # Captura direto da SEFAZ (NFeDistribuicaoDFe) com o certificado A1 de cada empresa, de hora em hora.
      SEFAZ_DIST_ENABLED: ${SEFAZ_DIST_ENABLED:-true}
      SEFAZ_DIST_CRON: ${SEFAZ_DIST_CRON:-0 15 * * * *}
      # UFs com captura automática (vírgula, ex. PE,PB); vazio = todas.
      SEFAZ_DIST_UFS: ${SEFAZ_DIST_UFS:-}
      # Ciência da Operação automática (só para planos com "Manifestação do destinatário").
      SEFAZ_AUTO_CIENCIA: ${SEFAZ_AUTO_CIENCIA:-true}
      # NFS-e pelo Ambiente Nacional (só para planos com "Integração NFS-e Nacional").
      NFSE_ADN_ENABLED: ${NFSE_ADN_ENABLED:-true}
      NFSE_ADN_CRON: ${NFSE_ADN_CRON:-0 25 * * * *}
      # false = produção restrita (ambiente de testes nacional)
      NFSE_ADN_PRODUCTION: ${NFSE_ADN_PRODUCTION:-true}
      # Pendências recalculadas de hora em hora.
      PENDENCIES_ENABLED: ${PENDENCIES_ENABLED:-true}
      PENDENCIES_CRON: ${PENDENCIES_CRON:-0 40 * * * *}
      # Auditoria tipo malha, todo dia às 05:30 (planos com "Auditoria de notas fiscais").
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
      AUDIT_CRON: ${AUDIT_CRON:-0 30 5 * * *}
      # Opcional: chave que cifra os certificados A1 e as senhas (openssl rand -base64 32). Vazia = sem essa criptografia.
      CERT_ENCRYPTION_KEY: ${CERT_ENCRYPTION_KEY:-}
      # Logins da CS Hub (vírgula, perfil ADMIN) que alteram as regras gerais - tabela de ICMS do Fronteira e regras
      # da auditoria, que valem para todos os escritórios - e usam o console da plataforma. Só valem para usuários do
      # escritório PLATFORM_FIRM_ID (F1-RN-04). Sem padrão: vazio = ninguém é admin da plataforma (aviso no log).
      PLATFORM_ADMIN_LOGINS: ${PLATFORM_ADMIN_LOGINS:-}
      # Id do escritório da CS Hub: admin da plataforma e o único isento de teste, bloqueio e limite (F1-RN-12).
      PLATFORM_FIRM_ID: ${PLATFORM_FIRM_ID:-}
      # Taxify SaaS fase 1. O cadastro público fica fechado até a versão real dos termos e o SES configurado (I1-1);
      # ligar TAXIFY_SIGNUP_ENABLED na EC2 só com aprovação do Tony.
      TAXIFY_SIGNUP_ENABLED: ${TAXIFY_SIGNUP_ENABLED:-false}
      TAXIFY_TERMS_VERSION: ${TAXIFY_TERMS_VERSION:-}
      TAXIFY_TERMS_URL: ${TAXIFY_TERMS_URL:-}
      TAXIFY_PRIVACY_URL: ${TAXIFY_PRIVACY_URL:-}
      TAXIFY_DPA_URL: ${TAXIFY_DPA_URL:-}
      TAXIFY_TRIAL_DAYS: ${TAXIFY_TRIAL_DAYS:-14}
      TAXIFY_TRIAL_MAX_COMPANIES: ${TAXIFY_TRIAL_MAX_COMPANIES:-5}
      TAXIFY_TRIAL_MAX_USERS: ${TAXIFY_TRIAL_MAX_USERS:-2}
      TAXIFY_SIGNUP_MAX_PER_IP_PER_DAY: ${TAXIFY_SIGNUP_MAX_PER_IP_PER_DAY:-3}
      TAXIFY_EMAIL_VERIFICATION_HOURS: ${TAXIFY_EMAIL_VERIFICATION_HOURS:-24}
      TAXIFY_EMAIL_RESEND_PER_HOUR: ${TAXIFY_EMAIL_RESEND_PER_HOUR:-3}
      # Teto diário dos reenvios do link de verificação (dia de Recife), por login e por IP.
      TAXIFY_EMAIL_RESEND_PER_DAY: ${TAXIFY_EMAIL_RESEND_PER_DAY:-5}
      TAXIFY_EMAIL_RESEND_PER_IP_PER_DAY: ${TAXIFY_EMAIL_RESEND_PER_IP_PER_DAY:-10}
      TAXIFY_UNVERIFIED_PURGE_DAYS: ${TAXIFY_UNVERIFIED_PURGE_DAYS:-7}
      # Na reativação, os meses bloqueados são recuperados (SIEG e e-Fisco) até N meses atrás do mês atual.
      TAXIFY_UNBLOCK_RECOVERY_MONTHS: ${TAXIFY_UNBLOCK_RECOVERY_MONTHS:-3}
      TAXIFY_TRIAL_NOTICE_CRON: ${TAXIFY_TRIAL_NOTICE_CRON:-0 0 9 * * *}
      TAXIFY_PUBLIC_URL: ${TAXIFY_PUBLIC_URL:-https://taxify.cshub.com.br}
      # De quem o X-Forwarded-For é aceito (IPs ou CIDR, vírgula). Vazio = loopback e redes privadas (Caddy e nginx do Docker).
      TAXIFY_TRUSTED_PROXIES: ${TAXIFY_TRUSTED_PROXIES:-}
      # Agendadores diários (horário de Recife): registro do BLOCKED e expurgo dos cadastros não verificados.
      TAXIFY_ACCESS_CRON: ${TAXIFY_ACCESS_CRON:-0 10 0 * * *}
      TAXIFY_UNVERIFIED_PURGE_CRON: ${TAXIFY_UNVERIFIED_PURGE_CRON:-0 20 3 * * *}
      # Liga/desliga os agendadores diários (vencimento do teste/liberação, expurgo e avisos do fim do teste).
      TAXIFY_ACCESS_ENABLED: ${TAXIFY_ACCESS_ENABLED:-true}
      TAXIFY_UNVERIFIED_PURGE_ENABLED: ${TAXIFY_UNVERIFIED_PURGE_ENABLED:-true}
      TAXIFY_TRIAL_NOTICE_ENABLED: ${TAXIFY_TRIAL_NOTICE_ENABLED:-true}
      # E-mail: LOG não envia nada; SES envia pela role IAM da EC2 (depois da I1-1).
      TAXIFY_MAIL_PROVIDER: ${TAXIFY_MAIL_PROVIDER:-LOG}
      TAXIFY_MAIL_FROM: ${TAXIFY_MAIL_FROM:-nao-responda@cshub.com.br}
      TAXIFY_MAIL_SES_REGION: ${TAXIFY_MAIL_SES_REGION:-us-east-2}
      # Só desenvolvimento: o LOG mostra o corpo do e-mail (com o link de verificação). Em produção, false.
      TAXIFY_MAIL_LOG_BODY: ${TAXIFY_MAIL_LOG_BODY:-false}
      # Só envia aos domínios/endereços da lista (vírgula; vazio = sem filtro) e o intervalo mínimo entre envios (ms).
      TAXIFY_MAIL_RECIPIENT_ALLOWLIST: ${TAXIFY_MAIL_RECIPIENT_ALLOWLIST:-}
      TAXIFY_MAIL_SEND_INTERVAL_MS: ${TAXIFY_MAIL_SEND_INTERVAL_MS:-1000}
      # Esqueci a senha / troca de senha (spec 2026-11-27). Ligar TAXIFY_PASSWORD_RESET_ENABLED na EC2 só depois da
      # saída do SES do sandbox e com aprovação do Tony.
      TAXIFY_PASSWORD_RESET_ENABLED: ${TAXIFY_PASSWORD_RESET_ENABLED:-false}
      TAXIFY_PASSWORD_RESET_MINUTES: ${TAXIFY_PASSWORD_RESET_MINUTES:-60}
      TAXIFY_PASSWORD_RESET_PER_HOUR: ${TAXIFY_PASSWORD_RESET_PER_HOUR:-3}
      TAXIFY_PASSWORD_RESET_PER_DAY: ${TAXIFY_PASSWORD_RESET_PER_DAY:-5}
      TAXIFY_PASSWORD_RESET_PER_IP_PER_DAY: ${TAXIFY_PASSWORD_RESET_PER_IP_PER_DAY:-10}
      TAXIFY_PASSWORD_MIN_LENGTH: ${TAXIFY_PASSWORD_MIN_LENGTH:-8}
      TAXIFY_PASSWORD_CHANGE_MAX_FAILURES: ${TAXIFY_PASSWORD_CHANGE_MAX_FAILURES:-5}
      TAXIFY_PASSWORD_CHANGED_NOTICE_ENABLED: ${TAXIFY_PASSWORD_CHANGED_NOTICE_ENABLED:-true}
      TAXIFY_PASSWORD_RESET_PURGE_CRON: ${TAXIFY_PASSWORD_RESET_PURGE_CRON:-0 30 3 * * *}
      TAXIFY_PASSWORD_RESET_PURGE_ENABLED: ${TAXIFY_PASSWORD_RESET_PURGE_ENABLED:-true}
      # Trabalho depois da resposta (Esqueci a senha e aviso de senha alterada): simultâneos e fila.
      TAXIFY_PASSWORD_ASYNC_MAX_CONCURRENT: ${TAXIFY_PASSWORD_ASYNC_MAX_CONCURRENT:-8}
      TAXIFY_PASSWORD_ASYNC_QUEUE_SIZE: ${TAXIFY_PASSWORD_ASYNC_QUEUE_SIZE:-100}
      # Resumo diário das pendências ALTA por e-mail. Ligar na EC2 só depois da saída do SES do sandbox (aprovação do Tony).
      TAXIFY_PENDENCY_ALERTS_ENABLED: ${TAXIFY_PENDENCY_ALERTS_ENABLED:-false}
      TAXIFY_PENDENCY_ALERT_CRON: ${TAXIFY_PENDENCY_ALERT_CRON:-0 50 7 * * MON-FRI}
      TAXIFY_PENDENCY_ALERT_TYPES: ${TAXIFY_PENDENCY_ALERT_TYPES:-}
      TAXIFY_PENDENCY_ALERT_DEFAULT_ON: ${TAXIFY_PENDENCY_ALERT_DEFAULT_ON:-true}
      TAXIFY_PENDENCY_ALERT_MAX_PER_DAY: ${TAXIFY_PENDENCY_ALERT_MAX_PER_DAY:-200}
      TAXIFY_PENDENCY_ALERT_MAX_COMPANIES_LISTED: ${TAXIFY_PENDENCY_ALERT_MAX_COMPANIES_LISTED:-30}
      # Painel da captura de XML. A visão da plataforma nasce desligada: ligar na EC2 só depois da política de
      # privacidade e do acordo de operador citarem a exceção à F1-RN-15, e com aprovação do Tony.
      TAXIFY_CAPTURE_PANEL_SIEG_FRESH_HOURS: ${TAXIFY_CAPTURE_PANEL_SIEG_FRESH_HOURS:-24}
      TAXIFY_CAPTURE_PANEL_DIRECT_FRESH_HOURS: ${TAXIFY_CAPTURE_PANEL_DIRECT_FRESH_HOURS:-3}
      TAXIFY_CAPTURE_PANEL_STALLED_MINUTES: ${TAXIFY_CAPTURE_PANEL_STALLED_MINUTES:-30}
      TAXIFY_CAPTURE_PANEL_MAX_PAGE_SIZE: ${TAXIFY_CAPTURE_PANEL_MAX_PAGE_SIZE:-100}
      TAXIFY_CAPTURE_PANEL_PLATFORM_ENABLED: ${TAXIFY_CAPTURE_PANEL_PLATFORM_ENABLED:-false}
      # "Sincronizar agora": vagas da rodada, espera entre atendimentos e limites por escritório.
      TAXIFY_CAPTURE_PRIORITY_ENABLED: ${TAXIFY_CAPTURE_PRIORITY_ENABLED:-true}
      TAXIFY_CAPTURE_PRIORITY_SLOTS_PER_TICK: ${TAXIFY_CAPTURE_PRIORITY_SLOTS_PER_TICK:-1}
      TAXIFY_CAPTURE_PRIORITY_COOLDOWN_MINUTES: ${TAXIFY_CAPTURE_PRIORITY_COOLDOWN_MINUTES:-60}
      TAXIFY_CAPTURE_PRIORITY_MAX_OPEN_PER_FIRM: ${TAXIFY_CAPTURE_PRIORITY_MAX_OPEN_PER_FIRM:-5}
      TAXIFY_CAPTURE_PRIORITY_PER_FIRM_PER_DAY: ${TAXIFY_CAPTURE_PRIORITY_PER_FIRM_PER_DAY:-10}
      TAXIFY_CAPTURE_PRIORITY_EXPIRE_HOURS: ${TAXIFY_CAPTURE_PRIORITY_EXPIRE_HOURS:-24}
      TAXIFY_CAPTURE_PRIORITY_RETENTION_DAYS: ${TAXIFY_CAPTURE_PRIORITY_RETENTION_DAYS:-90}
      TAXIFY_CAPTURE_PRIORITY_PURGE_ENABLED: ${TAXIFY_CAPTURE_PRIORITY_PURGE_ENABLED:-true}
      # Economia de chamadas ao SIEG (2 req/min para a conta inteira): recontagem do lado com total 0, NFS-e só com
      # diferença na contagem, eventos só no lado com nota recente e a linha diária de chamadas por finalidade.
      TAXIFY_SIEG_ZERO_TOTAL_RECOUNT_HOURS: ${TAXIFY_SIEG_ZERO_TOTAL_RECOUNT_HOURS:-6}
      # NFS-e pela contagem: off | shadow (só loga o que pularia; padrão) | on
      TAXIFY_SIEG_NFSE_COUNT_GATE: ${TAXIFY_SIEG_NFSE_COUNT_GATE:-shadow}
      TAXIFY_SIEG_EVENTS_ONLY_RECENT_NOTES: ${TAXIFY_SIEG_EVENTS_ONLY_RECENT_NOTES:-true}
      TAXIFY_SIEG_REQUEST_LOG_ENABLED: ${TAXIFY_SIEG_REQUEST_LOG_ENABLED:-true}
      TAXIFY_SIEG_REQUEST_LOG_CRON: ${TAXIFY_SIEG_REQUEST_LOG_CRON:-0 59 23 * * *}
      ACESSORIAS_SYNC_ENABLED: true
      ACESSORIAS_SYNC_CRON: 0 0 3 * * *
      BILLING_SYNC_ENABLED: true
      BILLING_SYNC_CRON: 0 30 3 * * *
      CONTA_AZUL_CLIENT_ID: ${CONTA_AZUL_CLIENT_ID:-}
      CONTA_AZUL_CLIENT_SECRET: ${CONTA_AZUL_CLIENT_SECRET:-}
      CONTA_AZUL_REDIRECT_URI: ${CONTA_AZUL_REDIRECT_URI:-}
      CONTA_AZUL_AUTHORIZE_URL: ${CONTA_AZUL_AUTHORIZE_URL:-}
      CONTA_AZUL_TOKEN_URL: ${CONTA_AZUL_TOKEN_URL:-}
    ports:
      - "5000:5000"
    volumes:
      - taxify_fiscal_xml:/data/fiscal-xml

  frontend:
    image: thiagoocms/taxify-ui:${TAG:-latest}
    # Alternativa: buildar da fonte local em vez de puxar a imagem do Docker Hub.
#    build:
#      context: ../taxify-front
#      dockerfile: Dockerfile
    container_name: taxify-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  taxify_mysql_data:
  taxify_fiscal_xml:
