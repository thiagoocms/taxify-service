server:
  port: 5000
  servlet:
    context-path: /taxify-service
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/taxify_dev?useUnicode=true&characterEncoding=utf8&useSSL=false
    username: root
    password: root
  application:
    name: taxify-service
    admin:
      enabled: false
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration
      - org.springframework.cloud.client.CommonsClientAutoConfiguration
  output:
    ansi:
      enabled: ALWAYS
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
  # POST /integrations/sieg/xmls/importar accepts a .zip of many NFe XMLs - default
  # 1MB limit is too small for that.
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

jwt:
  key:
    private: classpath:app.key
    public: classpath:app.pub

# SIEG integration (download + count fiscal XMLs) - see br.com.cshub.taxify.integration.sieg.
#
# api-key: generated by an admin user in "Minha Conta > Integrações API SIEG" (app.sieg.com).
#          Always required.
#
# client-id / client-secret / token-url: SIEG's partner integration model additionally
#          requires a JWT to be created via POST {token-url} with the X-Client-Id /
#          X-Secret-Key headers (see SiegTokenFeignClient). Client ID/Secret are issued
#          once by SIEG after approving an integration request submitted through
#          https://integracoes.sieg.com/clientes-sieg (their partner portal - it sits
#          behind a login, so this repo doesn't know how these were provisioned).
#          Leave these three blank to fall back to api-key-only calls (SIEG's simpler
#          self-service tier); fill them in once you have real values.
sieg:
  base-url: https://api.sieg.com
  api-key: ${SIEG_API_KEY:QW-8uWdY244VjK4fr1MfuIiL3fMAFyD6kLgnXRSQaA0}
  client-id: ${SIEG_CLIENT_ID:taxify_cshub_f37e31a2d417}
  client-secret: ${SIEG_CLIENT_SECRET:WJC4FGokcTQ-cVNACJCHR-elYDUwnX0IRrcHM8vTXm0}
  token-url: ${SIEG_TOKEN_URL:https://api.sieg.com/api/v1/create-jwt}
  # SIEG's baixar-xmls endpoint enforces a hard limit of 2 requests/minute for this
  # integration - SiegRateLimiter blocks the calling thread to stay under it.
  max-requests-per-minute: 2
  max-take-per-request: 50
  # Raw XML bytes downloaded from SIEG are written here (one file per document);
  # only the parsed field values and this path go into fiscal_xml_documents.

  xml-storage-path: ${SIEG_XML_STORAGE_PATH:./data/fiscal-xml}

# FiscalXmlSyncScheduler: periodically pulls new XMLs for active CNPJ companies so the
# search endpoint can serve everything from the database, without calling a provider on
# every request. Provider-agnostic - the scheduler only depends on the FiscalXmlProvider
# strategy interface; "provider" below picks which implementation runs by bean name
# (default/only one right now: "sieg", see SiegFiscalXmlProvider).
#
# A provider's rate limit is account-wide, not per company (SIEG: 2 requests/minute
# total) - so once there are more companies than that limit allows per tick, one run
# can't sync everyone without blocking for minutes. Instead each tick only syncs
# batch-size companies (round-robin cursor, every company gets a turn eventually), and
# cron should fire often - tune batch-size to whatever the active provider can take per
# tick (e.g. batch-size 2 with a once-a-minute cron matches SIEG's 2 req/min exactly).
# Each sync call always asks the provider for the whole current month (day 1 through
# today), not a rolling lookback window - so totals stay comparable tick to tick.
# reference-date is a TESTING-ONLY override for "today" (e.g. 2026-08-15) - when set,
# every tick syncs that date's whole month for every company instead of the real current
# month. Leave FISCAL_XML_SYNC_REFERENCE_DATE unset in production.
fiscal-xml:
  sync:
    enabled: ${FISCAL_XML_SYNC_ENABLED:true}
    cron: ${FISCAL_XML_SYNC_CRON:0 0/1 * * * *}
    batch-size: ${FISCAL_XML_SYNC_BATCH_SIZE:2}
    provider: ${FISCAL_XML_SYNC_PROVIDER:sieg}
#    reference-date: ${FISCAL_XML_SYNC_REFERENCE_DATE:2026-08-31}
  # FiscalXmlRectificationScheduler: automatic counterpart to "sync" above - re-checks
  # every note synced in the lookback window against the registered ProductFiscalRules
  # and writes a corrected file (+ audit log) for any that diverge. Runs 30 min past
  # the hour by default, after sync's on-the-hour run. A note with nothing to fix is a
  # cheap no-op, so this is safe to run repeatedly over the same window.
  rectification:
    enabled: ${FISCAL_XML_RECTIFICATION_ENABLED:true}
    cron: ${FISCAL_XML_RECTIFICATION_CRON:0 0/1 * * * *}
    lookback-days: ${FISCAL_XML_RECTIFICATION_LOOKBACK_DAYS:50}
  # FiscalXmlPurgeScheduler: deletes the physical XML files (original + rectified) of
  # notes older than retention-months, based on issue date - frees disk space. Only the
  # files go away; every extracted field stays in fiscal_xml_documents, so reporting and
  # the control table keep working, only re-exporting the raw XML of a purged note stops
  # being possible. Runs once a month (1st day, 4am) by default - retention is measured
  # in months, so a monthly check is frequent enough to stay close to the cutoff.
  purge:
    enabled: ${FISCAL_XML_PURGE_ENABLED:true}
    cron: ${FISCAL_XML_PURGE_CRON:0 0 4 1 * *}
    retention-months: ${FISCAL_XML_PURGE_RETENTION_MONTHS:3}

# baixar-xmls can take a while to respond when SIEG is zipping a large batch of XMLs,
# well past Feign's 10s/60s connect/read defaults - give both SIEG clients more room.
feign:
  client:
    config:
      siegClient:
        connect-timeout: 15000
        read-timeout: 180000
      siegTokenClient:
        connect-timeout: 15000
        read-timeout: 30000