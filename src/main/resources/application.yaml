server:
  port: ${SERVER_PORT}
  servlet:
    context-path: /taxify-service
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  application:
    name: taxify-service
    admin:
      enabled: false
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration
      - org.springframework.cloud.client.CommonsClientAutoConfiguration
  output:
    ansi:
      enabled: ALWAYS
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        enable_lazy_load_no_trans: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

jwt:
  key:
    private: classpath:app.key
    public: classpath:app.pub
sieg:
  base-url: https://api.sieg.com
  client-id: ${SIEG_CLIENT_ID}ó
  client-secret: ${SIEG_CLIENT_SECRET}
  max-requests-per-minute: 2
fiscal-xml:
  storage-path: ${FISCAL_XML_STORAGE_PATH}
  sync:
    enabled: ${FISCAL_XML_SYNC_ENABLED}
    cron: ${FISCAL_XML_SYNC_CRON}
    batch-size: ${FISCAL_XML_SYNC_BATCH_SIZE}
    provider: ${FISCAL_XML_SYNC_PROVIDER}
  rectification:
    enabled: ${FISCAL_XML_RECTIFICATION_ENABLED}
    cron: ${FISCAL_XML_RECTIFICATION_CRON}
    lookback-days: ${FISCAL_XML_RECTIFICATION_LOOKBACK_DAYS}
  purge:
    enabled: ${FISCAL_XML_PURGE_ENABLED}
    cron: ${FISCAL_XML_PURGE_CRON}
    retention-months: ${FISCAL_XML_PURGE_RETENTION_MONTHS}

feign:
  client:
    config:
      siegClient:
        connect-timeout: 15000
        read-timeout: 180000
      siegTokenClient:
        connect-timeout: 15000
        read-timeout: 30000