server:
  port: ${SERVER_PORT}
  # Atrás do Caddy/nginx: usa X-Forwarded-Proto/Host para que redirects e URLs saiam com https
  forward-headers-strategy: framework
  servlet:
    context-path: /taxify-service
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  application:
    name: taxify-service
    admin:
      enabled: false
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration
      - org.springframework.cloud.client.CommonsClientAutoConfiguration
  output:
    ansi:
      enabled: ALWAYS
  # Schema owned by Flyway: one Java migration per table (db.migration.V<n>__<Table>), each
  # creating its table or completing what an existing one lacks. Databases created before
  # Flyway are baselined at 0, so every migration runs on them too.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: true
    hibernate:
      # Transition: Hibernate still adds what an old database may lack after the migrations.
      # Switch to "validate" once every environment has run Flyway (JPA_DDL_AUTO=validate).
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        # unique keys are Flyway's - Hibernate's default drops and recreates them on every start
        schema_update:
          unique_constraint_strategy: SKIP
        enable_lazy_load_no_trans: true
        # lazy/eager associations of a list load in IN batches instead of one select per row (e.g. the company's CNPJ)
        default_batch_fetch_size: 50

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  task:
    scheduling:
      pool:
        size: 3

jwt:
  key:
    private: classpath:app.key
    public: classpath:app.pub
sieg:
  base-url: https://api.sieg.com
  client-id: ${SIEG_CLIENT_ID}
  client-secret: ${SIEG_CLIENT_SECRET}
  max-requests-per-minute: 2
  # Varredura diária de eventos só no lado com nota no banco emitida na janela (consulta local, sem chamada).
  events-only-with-recent-notes: ${TAXIFY_SIEG_EVENTS_ONLY_RECENT_NOTES:true}
  # Linha diária no log com as chamadas ao SIEG desta instância por finalidade (só contagens).
  request-log:
    enabled: ${TAXIFY_SIEG_REQUEST_LOG_ENABLED:true}
    cron: ${TAXIFY_SIEG_REQUEST_LOG_CRON:0 59 23 * * *}
conta-azul:
  client-id: ${CONTA_AZUL_CLIENT_ID:}
  client-secret: ${CONTA_AZUL_CLIENT_SECRET:}
  redirect-uri: ${CONTA_AZUL_REDIRECT_URI:http://ec2-52-14-79-235.us-east-2.compute.amazonaws.com/integracoes/conta-azul/callback}
  authorize-url: ${CONTA_AZUL_AUTHORIZE_URL:https://login.contaazul.com/#/oauth/authorize}
  token-url: ${CONTA_AZUL_TOKEN_URL:https://api-v2.contaazul.com/oauth/token}
billing:
  sync-enabled: ${BILLING_SYNC_ENABLED:true}
  sync-cron: ${BILLING_SYNC_CRON:0 30 3 * * *}
acessorias:
  base-url: https://api.acessorias.com
  sync-enabled: ${ACESSORIAS_SYNC_ENABLED:true}
  sync-cron: ${ACESSORIAS_SYNC_CRON:0 0 3 * * *}
fiscal-xml:
  sync:
    enabled: ${FISCAL_XML_SYNC_ENABLED}
    cron: ${FISCAL_XML_SYNC_CRON}
    batch-size: ${FISCAL_XML_SYNC_BATCH_SIZE}
    provider: ${FISCAL_XML_SYNC_PROVIDER}
    storage-path: ${FISCAL_XML_STORAGE_PATH}
    # Economia de chamadas ao SIEG (limite de 2 req/min para a conta inteira).
    # Lado com total 0 verificado hoje fica "em dia" por N horas antes de recontar (0 = reconta a cada tentativa).
    zero-total-recount-hours: ${TAXIFY_SIEG_ZERO_TOTAL_RECOUNT_HOURS:6}
    # Até este dia do mês, confere também as NF-e do mês anterior pela contagem (0 = nunca).
    previous-month-days: ${TAXIFY_SIEG_PREVIOUS_MONTH_DAYS:10}
    # NFS-e pela contagem do SIEG: off (35 dias todo dia), shadow (baixa como off e só loga o que pularia) ou on
    # (baixa o mês só quando a contagem passa do que o SIEG já entregou).
    service-invoice-count-gate: ${TAXIFY_SIEG_NFSE_COUNT_GATE:shadow}
  # Where the XML files go: local (the volume at storage-path) or s3. With s3, files already on
  # disk keep being read from there; migrate-local=true copies them to the bucket in background.
  # AWS credentials: EC2 instance role (recommended) or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY.
  storage:
    type: ${FISCAL_XML_STORAGE_TYPE:local}
    migrate-local: ${FISCAL_XML_STORAGE_MIGRATE_LOCAL:false}
    s3:
      bucket: ${FISCAL_XML_S3_BUCKET:}
      region: ${FISCAL_XML_S3_REGION:us-east-2}
      prefix: ${FISCAL_XML_S3_PREFIX:fiscal-xml}
      endpoint: ${FISCAL_XML_S3_ENDPOINT:}
  rectification:
    enabled: ${FISCAL_XML_RECTIFICATION_ENABLED}
    cron: ${FISCAL_XML_RECTIFICATION_CRON}
    lookback-days: ${FISCAL_XML_RECTIFICATION_LOOKBACK_DAYS}
  purge:
    enabled: ${FISCAL_XML_PURGE_ENABLED}
    cron: ${FISCAL_XML_PURGE_CRON}
    retention-months: ${FISCAL_XML_PURGE_RETENTION_MONTHS}

# Captura de XML direto da SEFAZ (NFeDistribuicaoDFe) com o certificado A1 de cada empresa, junto com o SIEG.
# Só roda para empresas com certificado enviado e o serviço de importação de XML no plano.
sefaz:
  dist:
    enabled: ${SEFAZ_DIST_ENABLED:true}
    cron: ${SEFAZ_DIST_CRON:0 15 * * * *}
    production: ${SEFAZ_DIST_PRODUCTION:true}
    max-batches-per-company: ${SEFAZ_DIST_MAX_BATCHES:40}
    # UFs com captura automática (separadas por vírgula, ex. PE,PB); vazio = todas.
    ufs: ${SEFAZ_DIST_UFS:}
    # Envia a Ciência da Operação (evento 210210, assinado com o A1) para as entradas que a SEFAZ
    # entrega só como resumo, e busca o XML completo pela chave na consulta seguinte.
    auto-ciencia: ${SEFAZ_AUTO_CIENCIA:true}

# NFS-e pelo Ambiente Nacional (Sistema Nacional NFS-e) - API de contribuintes, com o A1 da empresa.
nfse:
  adn:
    enabled: ${NFSE_ADN_ENABLED:true}
    cron: ${NFSE_ADN_CRON:0 25 * * * *}
    # false = produção restrita (ambiente de testes nacional)
    production: ${NFSE_ADN_PRODUCTION:true}

# Auditoria tipo malha (M9): todo dia, competência anterior e atual das empresas com "Auditoria de notas fiscais" no plano.
audit:
  enabled: ${AUDIT_ENABLED:true}
  cron: ${AUDIT_CRON:0 30 5 * * *}

# Painel de pendências (M13): recalcula as pendências de todas as empresas (depois da captura SEFAZ das :15).
pendencies:
  enabled: ${PENDENCIES_ENABLED:true}
  cron: ${PENDENCIES_CRON:0 40 * * * *}

# Opcional: chave AES-256 (base64, 32 bytes - openssl rand -base64 32) que cifra os certificados
# A1 e suas senhas. Vazia = guardados sem essa criptografia. Perdê-la = reenviar os cifrados.
taxify:
  secrets:
    key: ${CERT_ENCRYPTION_KEY:}
  platform:
    # Logins (vírgula) da CS Hub que alteram as regras gerais (tabela de ICMS do Fronteira, regras da auditoria),
    # que valem para todos os escritórios, e usam o console da plataforma (/platform). Precisa ter o perfil ADMIN e
    # ser do escritório PLATFORM_FIRM_ID (F1-RN-04). Vazio = ninguém é admin da plataforma.
    admin-logins: ${PLATFORM_ADMIN_LOGINS:}
    # Id (UUID) do escritório da CS Hub: o único isento de teste, bloqueio e limite (F1-RN-12). Vazio = nenhum.
    firm-id: ${PLATFORM_FIRM_ID:}
  # Taxify SaaS fase 1: cadastro público, teste grátis e liberação (spec 2026-11-26, seção 11).
  saas:
    # O cadastro público só abre com true E uma versão real dos termos (nem vazia, nem começando com RASCUNHO).
    # Ligar na EC2 é deploy de produção: só com aprovação do Tony.
    signup-enabled: ${TAXIFY_SIGNUP_ENABLED:false}
    terms-version: ${TAXIFY_TERMS_VERSION:}
    terms-url: ${TAXIFY_TERMS_URL:}
    privacy-url: ${TAXIFY_PRIVACY_URL:}
    dpa-url: ${TAXIFY_DPA_URL:}
    trial-days: ${TAXIFY_TRIAL_DAYS:14}
    trial-max-companies: ${TAXIFY_TRIAL_MAX_COMPANIES:5}
    trial-max-users: ${TAXIFY_TRIAL_MAX_USERS:2}
    signup-max-per-ip-per-day: ${TAXIFY_SIGNUP_MAX_PER_IP_PER_DAY:3}
    email-verification-hours: ${TAXIFY_EMAIL_VERIFICATION_HOURS:24}
    email-resend-per-hour: ${TAXIFY_EMAIL_RESEND_PER_HOUR:3}
    # Teto diário dos reenvios do link (dia civil de Recife): por login e por IP. Acima dele: 202 sem envio.
    email-resend-per-day: ${TAXIFY_EMAIL_RESEND_PER_DAY:5}
    email-resend-per-ip-per-day: ${TAXIFY_EMAIL_RESEND_PER_IP_PER_DAY:10}
    unverified-purge-days: ${TAXIFY_UNVERIFIED_PURGE_DAYS:7}
    # Na reativação, recupera os meses bloqueados (SIEG e e-Fisco) até N meses atrás do mês atual.
    unblock-recovery-months: ${TAXIFY_UNBLOCK_RECOVERY_MONTHS:3}
    # Endereço do Taxify nos links dos e-mails (verificação e avisos).
    public-url: ${TAXIFY_PUBLIC_URL:https://taxify.cshub.com.br}
    # De quem o X-Forwarded-For é aceito (vírgula: IPs ou prefixos CIDR). Vazio = loopback e redes privadas (Docker).
    trusted-proxies: ${TAXIFY_TRUSTED_PROXIES:}
    # Agendadores diários, horário de Recife: vencimento do teste/liberação, expurgo dos não verificados e avisos.
    access-cron: ${TAXIFY_ACCESS_CRON:0 10 0 * * *}
    purge-cron: ${TAXIFY_UNVERIFIED_PURGE_CRON:0 20 3 * * *}
    trial-notice-cron: ${TAXIFY_TRIAL_NOTICE_CRON:0 0 9 * * *}
    # Liga/desliga cada um desses agendadores (padrão ligado).
    access-enabled: ${TAXIFY_ACCESS_ENABLED:true}
    purge-enabled: ${TAXIFY_UNVERIFIED_PURGE_ENABLED:true}
    trial-notice-enabled: ${TAXIFY_TRIAL_NOTICE_ENABLED:true}
  # E-mail (F1-RN-17): LOG só registra (desenvolvimento e testes, nunca envia); SES envia pela role IAM da EC2 (I1-1).
  mail:
    provider: ${TAXIFY_MAIL_PROVIDER:LOG}
    from: ${TAXIFY_MAIL_FROM:nao-responda@cshub.com.br}
    ses-region: ${TAXIFY_MAIL_SES_REGION:us-east-2}
    # Só desenvolvimento: o LOG mostra o corpo (com o link de verificação). Em produção fica false.
    log-body: ${TAXIFY_MAIL_LOG_BODY:false}
    # Só envia aos domínios ou endereços da lista (vírgula; vazia = sem filtro) - testes com o SES no sandbox (AV-RN-13).
    recipient-allowlist: ${TAXIFY_MAIL_RECIPIENT_ALLOWLIST:}
    # Intervalo mínimo entre dois envios, em ms (taxa do SES; 1000 = o ritmo do sandbox). 0 = sem espera.
    send-interval-ms: ${TAXIFY_MAIL_SEND_INTERVAL_MS:1000}
  # Senha e sessões (spec 2026-11-27, seção 5). O "Esqueci a senha" nasce desligado: na EC2 só depois da saída do SES do
  # sandbox e com aprovação do Tony. A troca logada (PUT /users/me/password) não depende desta chave.
  password:
    reset-enabled: ${TAXIFY_PASSWORD_RESET_ENABLED:false}
    reset-minutes: ${TAXIFY_PASSWORD_RESET_MINUTES:60}
    reset-per-hour: ${TAXIFY_PASSWORD_RESET_PER_HOUR:3}
    reset-per-day: ${TAXIFY_PASSWORD_RESET_PER_DAY:5}
    reset-per-ip-per-day: ${TAXIFY_PASSWORD_RESET_PER_IP_PER_DAY:10}
    min-length: ${TAXIFY_PASSWORD_MIN_LENGTH:8}
    change-max-failures: ${TAXIFY_PASSWORD_CHANGE_MAX_FAILURES:5}
    changed-notice-enabled: ${TAXIFY_PASSWORD_CHANGED_NOTICE_ENABLED:true}
    # Limpeza diária dos links com mais de 48 h (horário de Recife).
    reset-purge-cron: ${TAXIFY_PASSWORD_RESET_PURGE_CRON:0 30 3 * * *}
    reset-purge-enabled: ${TAXIFY_PASSWORD_RESET_PURGE_ENABLED:true}
    # Trabalho depois da resposta ("Esqueci a senha" e aviso de senha alterada): simultâneos e fila. Lotou = descartado
    # com log só de contagem (a resposta continua 202).
    async-max-concurrent: ${TAXIFY_PASSWORD_ASYNC_MAX_CONCURRENT:8}
    async-queue-size: ${TAXIFY_PASSWORD_ASYNC_QUEUE_SIZE:100}
  # Resumo diário das pendências ALTA por e-mail (spec 2026-11-27, seção 6). Nasce desligado: na EC2 só depois da saída
  # do SES do sandbox e com aprovação do Tony.
  pendency-alerts:
    enabled: ${TAXIFY_PENDENCY_ALERTS_ENABLED:false}
    # Horário de Recife; de segunda a sexta (a segunda leva o fim de semana).
    cron: ${TAXIFY_PENDENCY_ALERT_CRON:0 50 7 * * MON-FRI}
    # Tipos que entram (vírgula, nomes de PendencyType); vazio = todos os de severidade ALTA.
    types: ${TAXIFY_PENDENCY_ALERT_TYPES:}
    default-on: ${TAXIFY_PENDENCY_ALERT_DEFAULT_ON:true}
    max-per-day: ${TAXIFY_PENDENCY_ALERT_MAX_PER_DAY:200}
    max-companies-listed: ${TAXIFY_PENDENCY_ALERT_MAX_COMPANIES_LISTED:30}
  # Painel da captura de XML (spec 2026-11-27, seção 10). Janelas de "em dia" decididas pelo Tony (P-CP-03).
  capture-panel:
    sieg-fresh-hours: ${TAXIFY_CAPTURE_PANEL_SIEG_FRESH_HOURS:24}
    direct-fresh-hours: ${TAXIFY_CAPTURE_PANEL_DIRECT_FRESH_HOURS:3}
    # Fila SIEG "parada": maior que o intervalo do cron mais a duração de uma rodada.
    stalled-minutes: ${TAXIFY_CAPTURE_PANEL_STALLED_MINUTES:30}
    max-page-size: ${TAXIFY_CAPTURE_PANEL_MAX_PAGE_SIZE:100}
    # Visão da plataforma (/platform/capture-panel, 404 quando false). Nasce desligada: ligar na EC2 só depois de a
    # política de privacidade e o acordo de operador citarem a exceção à F1-RN-15, e com aprovação do Tony.
    platform-enabled: ${TAXIFY_CAPTURE_PANEL_PLATFORM_ENABLED:false}
  # "Sincronizar agora" (CP-RN-15 a CP-RN-20; limites da P-CP-04 e P-CP-05). Só muda a ordem da fila SIEG.
  capture-priority:
    enabled: ${TAXIFY_CAPTURE_PRIORITY_ENABLED:true}
    slots-per-tick: ${TAXIFY_CAPTURE_PRIORITY_SLOTS_PER_TICK:1}
    cooldown-minutes: ${TAXIFY_CAPTURE_PRIORITY_COOLDOWN_MINUTES:60}
    max-open-per-firm: ${TAXIFY_CAPTURE_PRIORITY_MAX_OPEN_PER_FIRM:5}
    per-firm-per-day: ${TAXIFY_CAPTURE_PRIORITY_PER_FIRM_PER_DAY:10}
    expire-hours: ${TAXIFY_CAPTURE_PRIORITY_EXPIRE_HOURS:24}
    # Limpeza diária dos pedidos com mais de N dias (horário de Recife).
    retention-days: ${TAXIFY_CAPTURE_PRIORITY_RETENTION_DAYS:90}
    purge-cron: ${TAXIFY_CAPTURE_PRIORITY_PURGE_CRON:0 45 3 * * *}
    purge-enabled: ${TAXIFY_CAPTURE_PRIORITY_PURGE_ENABLED:true}
  # Reforma Tributária (specs 2026-11-27, Onda 1).
  reform:
    # Levantamento do crédito presumido de CBS sobre o estoque (F5a). Nasce desligado: com false a rotina não roda e
    # /reform/stock-credit/** responde 404. Ligar na EC2 só depois do QA e do paralelo V-5a-2, com aprovação do Tony.
    stock-survey:
      enabled: ${TAXIFY_STOCK_SURVEY_ENABLED:false}
      # Horário de Recife; uma instância por dia (routine_runs).
      cron: ${TAXIFY_STOCK_SURVEY_CRON:0 15 6 * * *}
      # Segunda tentativa do dia: só roda se o dia não tem rodada ou a rodada está vencida (stale-minutes).
      retry-cron: ${TAXIFY_STOCK_SURVEY_RETRY_CRON:0 0 9 * * *}
      refresh-cooldown-minutes: ${TAXIFY_STOCK_SURVEY_REFRESH_COOLDOWN_MINUTES:10}
      # Rodada do dia sem fim registrado há mais que isso: outra instância pode assumir.
      stale-minutes: ${TAXIFY_STOCK_SURVEY_STALE_MINUTES:120}
      batch-size: ${TAXIFY_STOCK_SURVEY_BATCH_SIZE:50}

# Timeouts of the Feign clients. OpenFeign 4+ reads only "spring.cloud.openfeign.client.config" - under the old
# "feign.client.config" prefix these were ignored and every client ran on the defaults (10s connect, 60s read),
# which cut SIEG's batch downloads ("Read timed out") well before the 180s meant for them.
spring.cloud.openfeign:
  client:
    config:
      siegClient:
        connect-timeout: 15000
        read-timeout: 180000
      siegTokenClient:
        connect-timeout: 15000
        read-timeout: 30000
      acessoriasClient:
        connect-timeout: 15000
        read-timeout: 60000

# Actuator on the same port as the app - only /actuator/health is exposed (see "include"
# below), and SecurityConfig explicitly permitAlls just that path. Monitoring of the EC2
# (CPU, memory, disk, logs) is done by CloudWatch - see monitoring/README.md.
management:
  endpoints:
    web:
      exposure:
        include: health
  metrics:
    tags:
      application: ${spring.application.name}