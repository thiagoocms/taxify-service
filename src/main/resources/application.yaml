server:
  port: ${SERVER_PORT}
  servlet:
    context-path: /taxify-service
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  application:
    name: taxify-service
    admin:
      enabled: false
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration
      - org.springframework.cloud.client.CommonsClientAutoConfiguration
  output:
    ansi:
      enabled: ALWAYS
  # Schema owned by Flyway: one Java migration per table (db.migration.V<n>__<Table>), each
  # creating its table or completing what an existing one lacks. Databases created before
  # Flyway are baselined at 0, so every migration runs on them too.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: true
    hibernate:
      # Transition: Hibernate still adds what an old database may lack after the migrations.
      # Switch to "validate" once every environment has run Flyway (JPA_DDL_AUTO=validate).
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        # unique keys are Flyway's - Hibernate's default drops and recreates them on every start
        schema_update:
          unique_constraint_strategy: SKIP
        enable_lazy_load_no_trans: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  task:
    scheduling:
      pool:
        size: 3

jwt:
  key:
    private: classpath:app.key
    public: classpath:app.pub
sieg:
  base-url: https://api.sieg.com
  client-id: ${SIEG_CLIENT_ID}
  client-secret: ${SIEG_CLIENT_SECRET}
  max-requests-per-minute: 2
conta-azul:
  client-id: ${CONTA_AZUL_CLIENT_ID:}
  client-secret: ${CONTA_AZUL_CLIENT_SECRET:}
  redirect-uri: ${CONTA_AZUL_REDIRECT_URI:http://ec2-52-14-79-235.us-east-2.compute.amazonaws.com/integracoes/conta-azul/callback}
  authorize-url: ${CONTA_AZUL_AUTHORIZE_URL:https://login.contaazul.com/#/oauth/authorize}
  token-url: ${CONTA_AZUL_TOKEN_URL:https://api-v2.contaazul.com/oauth/token}
billing:
  sync-enabled: ${BILLING_SYNC_ENABLED:true}
  sync-cron: ${BILLING_SYNC_CRON:0 30 3 * * *}
acessorias:
  base-url: https://api.acessorias.com
  sync-enabled: ${ACESSORIAS_SYNC_ENABLED:true}
  sync-cron: ${ACESSORIAS_SYNC_CRON:0 0 3 * * *}
fiscal-xml:
  sync:
    enabled: ${FISCAL_XML_SYNC_ENABLED}
    cron: ${FISCAL_XML_SYNC_CRON}
    batch-size: ${FISCAL_XML_SYNC_BATCH_SIZE}
    provider: ${FISCAL_XML_SYNC_PROVIDER}
    storage-path: ${FISCAL_XML_STORAGE_PATH}
  # Where the XML files go: local (the volume at storage-path) or s3. With s3, files already on
  # disk keep being read from there; migrate-local=true copies them to the bucket in background.
  # AWS credentials: EC2 instance role (recommended) or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY.
  storage:
    type: ${FISCAL_XML_STORAGE_TYPE:local}
    migrate-local: ${FISCAL_XML_STORAGE_MIGRATE_LOCAL:false}
    s3:
      bucket: ${FISCAL_XML_S3_BUCKET:}
      region: ${FISCAL_XML_S3_REGION:us-east-2}
      prefix: ${FISCAL_XML_S3_PREFIX:fiscal-xml}
      endpoint: ${FISCAL_XML_S3_ENDPOINT:}
  rectification:
    enabled: ${FISCAL_XML_RECTIFICATION_ENABLED}
    cron: ${FISCAL_XML_RECTIFICATION_CRON}
    lookback-days: ${FISCAL_XML_RECTIFICATION_LOOKBACK_DAYS}
  purge:
    enabled: ${FISCAL_XML_PURGE_ENABLED}
    cron: ${FISCAL_XML_PURGE_CRON}
    retention-months: ${FISCAL_XML_PURGE_RETENTION_MONTHS}

# Captura de XML direto da SEFAZ (NFeDistribuicaoDFe) com o certificado A1 de cada empresa, junto com o SIEG.
# Só roda para empresas com certificado enviado e o serviço de importação de XML no plano.
sefaz:
  dist:
    enabled: ${SEFAZ_DIST_ENABLED:true}
    cron: ${SEFAZ_DIST_CRON:0 15 * * * *}
    production: ${SEFAZ_DIST_PRODUCTION:true}
    max-batches-per-company: ${SEFAZ_DIST_MAX_BATCHES:40}
    # UFs com captura automática (separadas por vírgula; vazio = todas). Começa por PE.
    ufs: ${SEFAZ_DIST_UFS:PE}
    # Envia a Ciência da Operação (evento 210210, assinado com o A1) para as entradas que a SEFAZ
    # entrega só como resumo, e busca o XML completo pela chave na consulta seguinte.
    auto-ciencia: ${SEFAZ_AUTO_CIENCIA:true}

# Painel de pendências (M13): recalcula as pendências de todas as empresas (depois da captura SEFAZ das :15).
pendencies:
  enabled: ${PENDENCIES_ENABLED:true}
  cron: ${PENDENCIES_CRON:0 40 * * * *}

# Opcional: chave AES-256 (base64, 32 bytes - openssl rand -base64 32) que cifra os certificados
# A1 e suas senhas. Vazia = guardados sem essa criptografia. Perdê-la = reenviar os cifrados.
taxify:
  secrets:
    key: ${CERT_ENCRYPTION_KEY:}

feign:
  client:
    config:
      siegClient:
        connect-timeout: 15000
        read-timeout: 180000
      siegTokenClient:
        connect-timeout: 15000
        read-timeout: 30000
      acessoriasClient:
        connect-timeout: 15000
        read-timeout: 60000

# Actuator on the same port as the app - only /actuator/health is exposed (see "include"
# below), and SecurityConfig explicitly permitAlls just that path. Monitoring of the EC2
# (CPU, memory, disk, logs) is done by CloudWatch - see monitoring/README.md.
management:
  endpoints:
    web:
      exposure:
        include: health
  metrics:
    tags:
      application: ${spring.application.name}